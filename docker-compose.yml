services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kafka-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-net

  broker:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-broker
    hostname: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - zookeeper
    networks:
      - kafka-net
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b broker:29092 1 30 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:29092
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - kafka-net

  init-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      cub kafka-ready -b broker:29092 1 30 &&
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic requests --partitions 3 --replication-factor 1 &&
      kafka-topics --create --if-not-exists --bootstrap-server broker:29092 --topic responses --partitions 3 --replication-factor 1
      "
    networks:
      - kafka-net

  gateway:
    build: ./gateway
    container_name: kafka-gateway
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_REQUEST_TOPIC: requests
      KAFKA_RESPONSE_TOPIC: responses
    depends_on:
      - init-kafka
      - broker
    networks:
      - kafka-net
    restart: unless-stopped

  worker:
    build: ./service
    container_name: kafka-worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      KAFKA_REQUEST_TOPIC: requests
      KAFKA_RESPONSE_TOPIC: responses
    depends_on:
      - init-kafka
      - broker
    networks:
      - kafka-net
    restart: unless-stopped

networks:
  kafka-net:
    driver: bridge
